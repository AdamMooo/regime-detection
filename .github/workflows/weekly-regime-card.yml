name: Weekly Regime Card

# Regenerates the live label + regime_card.json on a weekly cadence (the label
# switches ~1.66x/yr, so daily regeneration would just be noise) and commits the
# result back to main. portfolio-manager fetches results/regime_card.json from
# here (raw content, PAT-authed) for its daily one-liner + weekly positioning
# email. No secrets needed: live_label.py's only network call is a public SPY
# pull via yfinance; the base French panel is already tracked in the repo.
on:
  schedule:
    - cron: "0 10 * * 1"   # Monday 10:00 UTC — ahead of portfolio-manager's 11:30 UTC daily brief
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regime-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate live label + regime card
        run: |
          python scripts/live_label.py
          python scripts/regime_signal.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/label_live.csv results/regime_card.json
          git diff --cached --quiet && echo "No change — skipping commit" || \
            git commit -m "chore: weekly regime card refresh [skip ci]" && git push
