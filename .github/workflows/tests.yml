name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: pip install numpy pandas pytest
      - name: Jump-model and backtest suites
        run: pytest tests/test_jumpmodel.py tests/test_backtest.py -v --tb=short
