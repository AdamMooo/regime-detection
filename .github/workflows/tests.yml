name: Tests and Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check-version-pins:
    runs-on: ubuntu-latest
    name: Check JAX/NumPyro Version Pinning
    steps:
      - uses: actions/checkout@v3
      - name: Verify exact version pins
        run: |
          echo "Checking JAX/NumPyro version pinning..."
          if grep -E 'jax.*>=' requirements.txt; then
            echo "ERROR: JAX version must use == operator, not >=. See CLAUDE.md hard constraints."
            exit 1
          fi
          if grep -E 'numpyro.*>=' requirements.txt; then
            echo "ERROR: NumPyro version must use == operator, not >=. See CLAUDE.md hard constraints."
            exit 1
          fi
          echo "✓ JAX/NumPyro versions are correctly pinned with == operator"

  test:
    runs-on: ubuntu-latest
    needs: check-version-pins
    strategy:
      matrix:
        python-version: ['3.10']
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run causality tests
        run: |
          pytest tests/test_causality.py -v

      - name: Run bot integration tests
        run: |
          pytest tests/test_bot_integration.py -v

      - name: Run all tests
        run: |
          pytest tests/ -v --tb=short
