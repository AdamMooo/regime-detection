name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # Install the declared requirements, not a hand-picked subset. A subset is
      # how `arch` stayed missing from requirements.txt while CI stayed green.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bare pytest = the whole suite, including the guards that matter:
      # test_boundary_audit (HARD BOUNDARY), test_causal (look-ahead),
      # test_reproducibility (declared deps, artifact/producer agreement,
      # causal-guard registry). Never narrow this to named files again.
      - name: Full suite
        run: pytest -q
